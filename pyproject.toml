[build-system]
requires = ["setuptools>=80.0,<81", "Cython==3.0.8", "numpy>=1.26.3,<2.0", "build", "cibuildwheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymatchmaker"
version = "0.3.0"
description = "A package for real-time music alignment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache 2.0" }
keywords = ["music", "alignment", "midi", "audio"]
authors = [
    { name = "Matchmaker Development Team", email = "carloscancinochacon@gmail.com" },
]
urls = { Homepage = "https://github.com/pymatchmaker/matchmaker" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Cython",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "cython>=3.0.8",
    "numpy>=1.26.3,<2.0",
    "scipy>=1.11.4",
    "librosa>=0.10.1",
    "pandas>=2.0.0",
    "partitura>=1.9.0",
    "progressbar2>=4.2.0",
    "python-hiddenmarkov>=0.1.4",
    "matplotlib>=3.9.4",
    "parangonar>=3.3.2",
    "mido>=1.3.2",
    "pyfluidsynth>=1.3.3",
]

[project.optional-dependencies]
devices = [
    "pyaudio>=0.2.14",
    "python-rtmidi>=1.5.8",
]
dev = [
    "pymatchmaker[devices]",
    "pytest>=7.0",
    "pytest-timeout>=2.0",
    "black>=23.12.1",
    "isort>=5.13.2",
    "pre-commit>=3.6.0",
    "ipython>=8.12.0",
    "pyclean>=3.0.0",
    "ruff>=0.8.2",
]

[tool.setuptools.packages.find]
exclude = ["tests", "docs"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = ["F403", "E722", "F401", "F841"]
